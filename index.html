    <style>
        /* =========================================
           CSS VARIABLES & RESET (Premium Palette)
        ========================================= */
        :root {
            --bg-color-1: #0f172a;
            --bg-color-2: #1e1b4b;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-dark: #f8fafc;
            --text-light: #cbd5e1;
            
            /* 3D Liquid Button Colors */
            --water-base: #3b82f6;
            --water-shadow: #1d4ed8;
            --water-liquid: rgba(147, 197, 253, 0.4);

            --orange-base: #f97316;
            --orange-shadow: #c2410c;
            --orange-liquid: rgba(253, 186, 116, 0.5);

            --milk-base: #f1f5f9;
            --milk-shadow: #94a3b8;
            --milk-liquid: rgba(255, 255, 255, 0.7);
            --milk-text: #1e293b;

            --coffee-base: #78350f;
            --coffee-shadow: #451a03;
            --coffee-liquid: rgba(217, 119, 6, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Animated Deep Gradient Background */
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e3a8a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           MAIN CONTAINER (Premium Glassmorphism)
        ========================================= */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            max-width: 480px;
            width: 100%;
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.2);
            border: 1px solid var(--card-border);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleIn {
            0% { opacity: 0; transform: scale(0.9) translateY(40px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* =========================================
           HEADER & TYPOGRAPHY
        ========================================= */
        .header h1 {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            text-shadow: 0 10px 20px rgba(255, 75, 43, 0.3);
        }

        /* Eye-catching Animation for Subtitle */
        .header .subtitle {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 25px;
            /* Shimmer Gradient Effect */
            background: linear-gradient(90deg, #fbbf24, #fff, #fbbf24);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 2s linear infinite, attentionPulse 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        @keyframes attentionPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
            50% { transform: scale(1.05); text-shadow: 0 0 20px rgba(251, 191, 36, 0.8); }
        }

        /* =========================================
           PUZZLE SECTION (Static Image as requested)
        ========================================= */
        .puzzle-section h2 {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .puzzle-image-container {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(255,255,255,0.1);
            margin-bottom: 25px;
            background: #fff;
            position: relative;
            border: 4px solid #ffffff;
            /* Removed animation here */
        }

        .puzzle-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .viral-hook {
            font-size: 15px;
            color: #FF001C;
            font-weight: 700;
            background: linear-gradient(135deg, #FFCDD3, #FFC5CB);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(255, 141, 153, 0.4);
            border: 1px dashed rgba(255,0,28,0.3);
        }

        /* =========================================
           LIQUID STAIN 3D BUTTONS
        ========================================= */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 35px;
        }

        .answer-btn {
            position: relative;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            overflow: hidden; /* Keeps liquid inside */
            z-index: 1;
        }

        /* Base 3D Press styling */
        .answer-btn:active {
            transform: translateY(8px);
        }

        /* Liquid Blob Effect (দাগ / তরল পদার্থ) */
        .answer-btn::before, .answer-btn::after {
            content: '';
            position: absolute;
            z-index: -1;
            filter: blur(5px);
            animation: morph 5s linear infinite;
        }

        .answer-btn::before {
            width: 80px; height: 80px;
            top: -25px; left: -20px;
        }

        .answer-btn::after {
            width: 60px; height: 60px;
            bottom: -15px; right: -15px;
            animation-duration: 4s;
            animation-direction: reverse;
        }

        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
        }

        /* Buttons Styling */
        .btn-water { 
            background: var(--water-base); color: white;
            box-shadow: 0 10px 0 var(--water-shadow), 0 15px 20px rgba(0,0,0,0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .btn-water:active { box-shadow: 0 2px 0 var(--water-shadow), 0 5px 10px rgba(0,0,0,0.3); }
        .btn-water::before, .btn-water::after { background: var(--water-liquid); }

        .btn-orange { 
            background: var(--orange-base); color: white;
            box-shadow: 0 10px 0 var(--orange-shadow), 0 15px 20px rgba(0,0,0,0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .btn-orange:active { box-shadow: 0 2px 0 var(--orange-shadow), 0 5px 10px rgba(0,0,0,0.3); }
        .btn-orange::before, .btn-orange::after { background: var(--orange-liquid); }

        .btn-milk { 
            background: var(--milk-base); color: var(--milk-text);
            box-shadow: 0 10px 0 var(--milk-shadow), 0 15px 20px rgba(0,0,0,0.3);

        .btn-milk:active { box-shadow: 0 2px 0 var(--milk-shadow), 0 5px 10px rgba(0,0,0,0.3); }
        .btn-milk::before, .btn-milk::after { background: var(--milk-liquid); filter: blur(3px); }

        .btn-coffee {

        .btn-coffee::before, .btn-coffee::after { background: var(--coffee-liquid); }

        /* =========================================

        ========================================= */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);

            transition: opacity 0.4s ease;

        .overlay.active { opacity: 1; pointer-events: auto; }

        .popup {
            background: #ffffff;

            border-radius: 28px;

        }

        .overlay.active .popup {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .popup-icon { font-size: 70px; margin-bottom: 10px; line-height: 1; }
        
        .popup h3 { font-size: 28px; font-weight: 900; margin-bottom: 12px; }
        .popup p { font-size: 15px; margin-bottom: 30px; font-weight: 500; color: #4a5568; line-height: 1.5; }

        .close-btn {
            background: linear-gradient(135deg, #111, #333);
            color: white; border: none;
            padding: 15px 40px; border-radius: 50px;
            font-size: 18px; font-weight: 800;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);

        }

        .close-btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
        }

        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }

        /* =========================================
           RESPONSIVE DESIGN
        ========================================= */
        @media (max-width: 480px) {
            .container { padding: 30px 20px; border-radius: 25px; }
            .header h1 { font-size: 30px; }
            .answers-grid { gap: 12px; }
            .answer-btn { padding: 15px 10px; font-size: 16px; border-radius: 16px; box-shadow: 0 8px 0 var(--water-shadow); }
            .answer-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--water-shadow); }
            .share-btn { width: 50px; height: 50px; }
            .share-btn svg { width: 22px; height: 22px; }
            .popup { padding: 35px 25px; }
        }
    </style>
</head>

    <!-- JavaScript Logic -->
    <script>
        const CORRECT_ANSWER = "Orange"; 

        function checkAnswer(selectedAnswer) {
            const overlay = document.getElementById('result-overlay');
            const icon = document.getElementById('popup-icon');
            const title = document.getElementById('popup-title');
            const message = document.getElementById('popup-message');
            const btn = document.getElementById('popup-btn');

            if (selectedAnswer === CORRECT_ANSWER) {
                icon.innerText = "🏆";
                title.innerText = "Correct!";
                title.style.color = "#059669"; 
                message.innerText = "You solved the puzzle! You belong to the top 1% of sharp minds.";
                btn.innerText = "Awesome!";
                btn.style.background = "linear-gradient(135deg, #10b981, #059669)"; 
                startConfetti();
            } else {
                icon.innerText = "❌";
                title.innerText = "Not quite!";
                title.style.color = "#dc2626"; 
                message.innerText = "That glass won't fill first. Take another look at the blocked pipes and try again!";
                btn.innerText = "Close";
                btn.style.background = "linear-gradient(135deg, #ef4444, #dc2626)"; 
                stopConfetti();
            }

            overlay.classList.add('active');
        }

        function closePopup() {
            const overlay = document.getElementById('result-overlay');
            overlay.classList.remove('active');
            setTimeout(stopConfetti, 3000); 
        }

        function sharePopup(platform) {
            const shareUrl = encodeURIComponent(window.location.href);
            const shareText = encodeURIComponent("I just solved this insane Brain Puzzle! 95% of people fail. Can you solve it?");
            let finalUrl = '';

            if (platform === 'facebook') finalUrl = `https://www.facebook.com/sharer/sharer.php?u=${shareUrl}`;
            else if (platform === 'whatsapp') finalUrl = `https://api.whatsapp.com/send?text=${shareText} ${shareUrl}`;
            else if (platform === 'telegram') finalUrl = `https://t.me/share/url?url=${shareUrl}&text=${shareText}`;

            window.open(finalUrl, '_blank', 'width=600,height=500,toolbar=0,menubar=0');
        }

        // --- VANILLA JS CONFETTI ENGINE --- //
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;
        let isConfettiActive = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d', '#4facfe', '#00f2fe'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.w = Math.random() * 12 + 6;
                this.h = Math.random() * 12 + 6;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = Math.random() * 4 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.2 - 0.1;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;
                if (this.y > canvas.height && isConfettiActive) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                ctx.restore();
            }
        }

        function startConfetti() {
            isConfettiActive = true;
            particles = [];
            for (let i = 0; i < 200; i++) particles.push(new Particle());
            cancelAnimationFrame(animationId);
            animateConfetti();
        }

        function stopConfetti() { isConfettiActive = false; }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let particlesOnScreen = false;
            particles.forEach(p => {
                p.update(); p.draw();
                if (p.y < canvas.height) particlesOnScreen = true;
            });
            if (particlesOnScreen || isConfettiActive) {
                animationId = requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
